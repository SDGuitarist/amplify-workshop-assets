<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amplify — Email Signature Block</title>
  <link rel="stylesheet" href="styles-shared.css">
  <style>
    body { padding: 16px; background: #e8ddd0; }

    @media (min-width: 640px) {
      body { padding: 40px; }
    }

    .sig-block {
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
      background: linear-gradient(135deg, var(--deep-brown), var(--rich-brown));
      border-radius: 8px;
      overflow: hidden;
      font-family: var(--font-body);
      display: flex;
      flex-direction: column;
      border: 1px solid rgba(194,120,64,0.2);
    }

    @media (min-width: 480px) {
      .sig-block { flex-direction: row; }
    }

    .sig-photo {
      height: 120px;
      flex-shrink: 0;
    }

    @media (min-width: 480px) {
      .sig-photo { width: 120px; height: auto; }
    }

    .sig-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
    }

    .sig-content {
      padding: 16px 20px;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    @media (min-width: 640px) {
      .sig-content { padding: 20px 24px; }
    }

    .sig-content .sig-title {
      font-family: var(--font-display);
      font-size: 16px;
      font-weight: 700;
      background: var(--gradient-gold);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 2px;
    }

    @media (min-width: 640px) {
      .sig-content .sig-title { font-size: 18px; }
    }

    .sig-content .sig-subtitle {
      font-size: 11px;
      color: var(--soft-gold);
      margin-bottom: 8px;
    }

    @media (min-width: 640px) {
      .sig-content .sig-subtitle { font-size: 12px; margin-bottom: 10px; }
    }

    .sig-content .sig-meta {
      font-size: 11px;
      color: rgba(250,243,232,0.6);
      line-height: 1.5;
    }

    @media (min-width: 640px) {
      .sig-content .sig-meta { font-size: 12px; }
    }

    .sig-content .sig-meta strong { color: var(--cream); }

    .sig-content .sig-meta .phone {
      color: var(--cream);
      font-weight: 600;
    }

    /* Early bird CTA */
    .sig-cta {
      flex-shrink: 0;
      background: var(--gradient-early-bird);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px 16px;
      position: relative;
      overflow: hidden;
    }

    @media (min-width: 480px) {
      .sig-cta {
        width: 130px;
        flex-direction: column;
        gap: 0;
        padding: 16px;
        border-left: 1px solid rgba(255,255,255,0.1);
      }
    }

    @media (min-width: 640px) {
      .sig-cta { width: 140px; }
    }

    .sig-cta::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(255,255,255,0.1) 0%, transparent 50%);
      pointer-events: none;
    }

    .sig-cta .cta-price {
      font-family: var(--font-display);
      font-size: 24px;
      font-weight: 700;
      color: white;
      text-shadow: 0 2px 8px rgba(0,0,0,0.12);
      position: relative;
    }

    @media (min-width: 640px) {
      .sig-cta .cta-price { font-size: 28px; }
    }

    .sig-cta .cta-label {
      font-size: 10px;
      color: rgba(255,255,255,0.85);
      text-align: center;
      line-height: 1.3;
      font-weight: 500;
      position: relative;
    }
  </style>
</head>
<body>
  <a href="index.html" class="home-link">&#8592; All Assets</a>

  <div class="sig-block">
    <div class="sig-photo">
      <img src="images/alex-headshot.jpeg" alt="Alex Guillen">
    </div>
    <div class="sig-content">
      <div class="sig-title">Amplify: Human-Led AI</div>
      <div class="sig-subtitle">Hands-on Workshop · April 25</div>
      <div class="sig-meta">
        <strong>10 AM – 2 PM</strong> · Expressive Arts San Diego<br>
        3201 Thorn St, San Diego, CA 92104<br>
        <span class="phone">619-755-3246</span> · 30 seats only
      </div>
    </div>
    <div class="sig-cta">
      <div class="cta-price">$100</div>
      <div class="cta-label">Early Bird<br>through March 28</div>
    </div>
  </div>
</body>
</html>
