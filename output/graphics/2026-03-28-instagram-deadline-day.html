<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mar 28 — Instagram Deadline Day</title>
  <link rel="stylesheet" href="../../styles-shared.css">
  <style>
    .card {
      width: 1080px;
      height: 1080px;
      font-family: var(--font-body);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: var(--gradient-hero);
    }

    .card::before {
      content: '';
      position: absolute;
      top: -100px;
      right: -100px;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,107,74,0.15) 0%, transparent 70%);
    }

    .card::after {
      content: '';
      position: absolute;
      bottom: -80px;
      left: -80px;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,140,66,0.08) 0%, transparent 70%);
    }

    .card-top {
      padding: 80px 72px 0;
      position: relative;
      z-index: 1;
    }

    .hook {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 4.5px;
      text-transform: uppercase;
      background: linear-gradient(135deg, var(--highlight-coral), var(--highlight-orange));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 24px;
    }

    h1 {
      font-family: var(--font-display);
      font-size: 72px;
      font-weight: 700;
      background: linear-gradient(135deg, var(--highlight-coral) 0%, var(--highlight-orange) 40%, var(--golden) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1.1;
      margin-bottom: 16px;
    }

    .subtitle {
      font-size: 22px;
      color: rgba(250,243,232,0.6);
      line-height: 1.5;
    }

    .card-middle {
      padding: 0 72px;
      position: relative;
      z-index: 1;
    }

    .price-block {
      display: flex;
      align-items: center;
      gap: 24px;
      margin-bottom: 40px;
    }

    .price-current {
      background: var(--gradient-early-bird);
      border-radius: 16px;
      padding: 20px 40px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .price-current::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(255,255,255,0.12) 0%, transparent 50%);
      pointer-events: none;
    }

    .price-current .amount {
      font-family: var(--font-display);
      font-size: 64px;
      font-weight: 700;
      color: white;
      text-shadow: 0 2px 8px rgba(0,0,0,0.15);
      position: relative;
      line-height: 1;
    }

    .price-current .label {
      font-size: 14px;
      font-weight: 600;
      color: rgba(255,255,255,0.85);
      text-transform: uppercase;
      letter-spacing: 2px;
      position: relative;
    }

    .price-arrow {
      font-size: 32px;
      color: rgba(250,243,232,0.3);
    }

    .price-after {
      text-align: center;
    }

    .price-after .amount {
      font-family: var(--font-display);
      font-size: 48px;
      font-weight: 700;
      color: rgba(250,243,232,0.3);
      text-decoration: line-through;
      line-height: 1;
    }

    .price-after .label {
      font-size: 13px;
      color: rgba(250,243,232,0.25);
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .value-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .value-item {
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: 20px;
      color: rgba(250,243,232,0.75);
      line-height: 1.4;
    }

    .value-item .check {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: var(--gradient-early-bird);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      color: white;
      font-size: 14px;
      font-weight: 700;
    }

    .card-bottom {
      padding: 0 72px 64px;
      position: relative;
      z-index: 1;
    }

    .details-bar {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding-top: 28px;
      border-top: 2px solid rgba(255,107,74,0.25);
    }

    .detail { text-align: left; }

    .detail .d-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--highlight-coral);
      margin-bottom: 4px;
    }

    .detail .d-value {
      font-size: 20px;
      font-weight: 600;
      color: var(--cream);
    }

    .detail .d-value small {
      display: block;
      font-size: 13px;
      font-weight: 400;
      color: rgba(250,243,232,0.45);
    }

    .seats-badge {
      font-size: 15px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--highlight-coral);
    }
  </style>
</head>
<body>
  <!-- MOOD: mood-urgency mood-bold | instagram-square -->
  <div class="fixed-asset card mood-urgency mood-bold" data-width="1080">
    <div class="card-top">
      <div class="hook">Last day at this price</div>
      <h1>$100 ends<br>tonight.</h1>
      <div class="subtitle">Tomorrow it's $150.</div>
    </div>

    <div class="card-middle">
      <div class="price-block">
        <div class="price-current">
          <div class="label">Today</div>
          <div class="amount">$100</div>
        </div>
        <div class="price-arrow">→</div>
        <div class="price-after">
          <div class="label">Tomorrow</div>
          <div class="amount">$150</div>
        </div>
      </div>
      <div class="value-list">
        <div class="value-item">
          <div class="check">&#10003;</div>
          <span>4 hours, hands-on, with live AI systems</span>
        </div>
        <div class="value-item">
          <div class="check">&#10003;</div>
          <span>Expert-First framework you can use the next day</span>
        </div>
        <div class="value-item">
          <div class="check">&#10003;</div>
          <span>Accountability partner for two weeks after</span>
        </div>
      </div>
    </div>

    <div class="card-bottom">
      <div class="details-bar">
        <div class="detail">
          <div class="d-label">Workshop</div>
          <div class="d-value">April 25 <small>10 AM – 2 PM · Expressive Arts SD</small></div>
        </div>
        <div class="seats-badge">30 Seats</div>
      </div>
    </div>
  </div>
  <script src="../../asset-scale.js"></script>
</body>
</html>
