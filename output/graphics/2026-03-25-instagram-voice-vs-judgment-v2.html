<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mar 25 — Instagram Voice vs Judgment v2</title>
  <link rel="stylesheet" href="../../styles-shared.css">
  <style>
    .card {
      width: 1080px;
      height: 1080px;
      font-family: var(--font-body);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 80px 72px;
      background: var(--gradient-hero);
    }

    .card::before {
      content: '';
      position: absolute;
      top: -120px;
      right: -80px;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,140,66,0.08) 0%, transparent 70%);
    }

    .hook {
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 4px;
      text-transform: uppercase;
      background: var(--gradient-amber-glow);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 40px;
      position: relative;
      z-index: 1;
    }

    h1 {
      font-family: var(--font-display);
      font-size: 58px;
      font-weight: 700;
      background: var(--gradient-gold);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1.15;
      margin-bottom: 48px;
      position: relative;
      z-index: 1;
    }

    .divider {
      width: 60px;
      height: 3px;
      background: var(--gradient-early-bird);
      border-radius: 2px;
      margin-bottom: 48px;
      position: relative;
      z-index: 1;
    }

    .thesis {
      font-family: var(--font-display);
      font-size: 32px;
      font-weight: 500;
      color: var(--cream);
      line-height: 1.4;
      margin-bottom: 12px;
      position: relative;
      z-index: 1;
    }

    .thesis-accent {
      font-family: var(--font-display);
      font-size: 28px;
      font-weight: 400;
      color: rgba(250,243,232,0.5);
      line-height: 1.4;
      margin-bottom: 56px;
      position: relative;
      z-index: 1;
    }

    .bottom {
      display: flex;
      align-items: center;
      gap: 24px;
      position: relative;
      z-index: 1;
    }

    .meta-text {
      font-size: 16px;
      color: rgba(250,243,232,0.5);
      font-weight: 500;
    }

    .meta-text strong {
      color: var(--cream);
    }

    .price-badge {
      background: var(--gradient-early-bird);
      border-radius: 10px;
      padding: 10px 22px;
      font-family: var(--font-display);
      font-size: 20px;
      font-weight: 700;
      color: white;
      text-shadow: 0 1px 4px rgba(0,0,0,0.15);
      position: relative;
      overflow: hidden;
    }

    .price-badge::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(255,255,255,0.1) 0%, transparent 50%);
      pointer-events: none;
    }
  </style>
</head>
<body>
  <!-- MOOD: mood-framework mood-bold | instagram-square -->
  <div class="fixed-asset card mood-framework mood-bold" data-width="1080">
    <div class="hook">Amplify Workshop · Voice vs. Judgment</div>

    <h1>The voice took five&nbsp;minutes.<br>The judgment took 17&nbsp;rounds.</h1>

    <div class="divider"></div>

    <div class="thesis">Knowing what to say is one skill.</div>
    <div class="thesis-accent">Knowing what not to say is another.</div>

    <div class="bottom">
      <div class="meta-text"><strong>April 25</strong> · 30 seats</div>
      <div class="price-badge">$100 Early Bird</div>
    </div>
  </div>
  <script src="../../asset-scale.js"></script>
</body>
</html>
